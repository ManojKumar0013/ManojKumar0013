<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172" role="img" aria-label="What I learned building this. One GitHub calendar powers both the README map and the playable level. Recording inputs per tick lets the server replay runs and verify scores. The profile tests missing or malformed data before publishing a snapshot.">
