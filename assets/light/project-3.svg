<svg xmlns="http://www.w3.org/2000/svg" width="246" height="129" viewBox="0 0 246 129" role="img">
<title>ICEPOPS · Open repository</title>
<desc>Online ordering, loyalty and live order tracking.</desc>
<style>
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.fg{fill:#18211c}.dim{fill:#626c66}.faint{fill:#6a6254}.green{fill:#087344}.green2{fill:#9fd8bd}
.amber{fill:#875100}.amber2{fill:#ecd2a6}.mag{fill:#c2185b}.bgc{fill:#f7f5ef}.card{fill:#ffffff}.screen{fill:#fbfaf6}
.glow{filter:url(#glow)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fade{from{opacity:0}}
.fade{animation:fade .8s ease-out backwards}
@keyframes blink{50%{opacity:.84}}
.blink{animation:blink 1s ease-in-out 2}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.type{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:type .55s steps(24,end) backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
