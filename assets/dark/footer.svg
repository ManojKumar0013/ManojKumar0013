<svg xmlns="http://www.w3.org/2000/svg" width="840" height="315" viewBox="0 0 840 315" role="img" aria-label="What I learned building this. I learned to separate the data model from the presentation. The same contribution calendar drives the README map and the playable level. I learned to make browser gameplay reproducible by recording input changes per tick. The server can recompute the score independently from the browser. I learned to treat missing evidence as a data state. The profile distinguishes a learning goal from a public repo signal and tests how the pipeline handles missing or malformed inputs.">
<title>What I learned building this. I learned to separate the data model from the presentation. The same contribution calendar drives the README map and the playable level. I learned to make browser gameplay reproducible by recording input changes per tick. The server can recompute the score independently from the browser. I learned to treat missing evidence as a data state. The profile distinguishes a learning goal from a public repo signal and tests how the pipeline handles missing or malformed inputs.</title>
<defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="0"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="halo" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#ffcf78" stop-opacity="0.000"/><stop offset="1" stop-color="#ffcf78" stop-opacity="0"/></radialGradient>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.fg{fill:#fff0c9}.dim{fill:#ead09a}.faint{fill:#83978e}.green{fill:#ffcf78}.green2{fill:#1f7a52}
.amber{fill:#ffcc64}.amber2{fill:#7a5a22}.mag{fill:#f9a759}.bgc{fill:#251c0d}.card{fill:#0d1215}.screen{fill:#302412}
.glow{filter:url(#glow)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fade{from{opacity:0}}
.fade{animation:fade .8s ease-out backwards}
@keyframes blink{50%{opacity:.84}}
.blink{animation:blink 1s ease-in-out 2}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.type{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:type .55s steps(24,end) backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
