<svg xmlns="http://www.w3.org/2000/svg" width="420" height="138" viewBox="0 0 420 138" role="img" aria-label="NexTune. Mood-based music discovery with the Jamendo API.. Open repository.">
<title>NexTune. Mood-based music discovery with the Jamendo API.. Open repository.</title>
<defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="0"/></feComponentTransfer><feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="halo" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#ffcf78" stop-opacity="0.000"/><stop offset="1" stop-color="#ffcf78" stop-opacity="0"/></radialGradient>
</defs>
<style>
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.fg{fill:#fff0c9}.dim{fill:#ead09a}.faint{fill:#83978e}.green{fill:#ffcf78}.green2{fill:#1f7a52}
.amber{fill:#ffcc64}.amber2{fill:#7a5a22}.mag{fill:#f9a759}.bgc{fill:#251c0d}.card{fill:#0d1215}.screen{fill:#302412}
.glow{filter:url(#glow)}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fade{from{opacity:0}}
.fade{animation:fade .8s ease-out backwards}
@keyframes blink{50%{opacity:.84}}
.blink{animation:blink 1s ease-in-out 2}
@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.type{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:type .55s steps(24,end) backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="419" height="137" rx="14" fill="#251c0d" stroke="#956b28"/>
<rect x="1" y="34" width="418" height="103" rx="13" fill="url(#halo)"/>
<path d="M1 34V14.5Q1 1 14.5 1H405.5Q419 1 419 14.5V34z" fill="#3d2b11"/>
<line x1="1" y1="34.5" x2="419" y2="34.5" stroke="#956b28"/>
<rect x="18" y="13" width="8" height="8" class="green"/><rect x="30" y="13" width="8" height="8" class="amber"/><rect x="42" y="13" width="8" height="8" class="mag"/>
<text x="62" y="21.5" class="m dim" font-size="11.5">STAGE 04</text>
<text x="402" y="21.5" class="m dim" font-size="11.5" text-anchor="end">OPEN REPOSITORY</text>
<g class="rise"><text x="24" y="67" class="m fg" font-size="20" font-weight="700">NexTune</text><text x="24" y="94" class="m dim" font-size="16">Mood-based music discovery with the</text><text x="24" y="115" class="m dim" font-size="16">Jamendo API.</text><path d="M383 57h12v12m0-12-12 12" fill="none" stroke="#ffcc64" stroke-width="2"/></g>
</svg>